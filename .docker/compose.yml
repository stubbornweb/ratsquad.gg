# Dev-only compose — production deploys to Vercel
# Usage: docker compose -f .docker/compose.yml up

name: rats-site

services:
  app:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
      target: development
      args:
        # The container runs as this uid/gid. Defaults to 1001, matching the
        # production stage's nextjs user. Override via DOCKER_UID/DOCKER_GID
        # if your host user differs.
        UID: ${DOCKER_UID:-1001}
        GID: ${DOCKER_GID:-1001}
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/.next
    environment:
      - WATCHPACK_POLLING=true
    restart: unless-stopped
