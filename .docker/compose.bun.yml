# compose.bun.yml — Standalone Bun dev environment
# Usage: make bun-dev OR docker compose -f .docker/compose.bun.yml up

name: rats-site

services:
  app:
    image: oven/bun
    container_name: rats-site-dev
    # Run as the host user so files written into the bind mount stay host-owned.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    ports:
      - "3000:3000"
    volumes:
      - ../:/app
      # Container-only — keeps bun's tree off the host's npm-managed node_modules.
      # Named (not anonymous) so `make bun-perms` can chown them to the host user.
      - bun_node_modules:/app/node_modules
      - bun_next:/app/.next
    working_dir: /app
    environment:
      - NODE_ENV=development
      - PORT=3000
      - WATCHPACK_POLLING=true
      # Non-root user has no writable $HOME in the image; bun caches here instead.
      - HOME=/tmp
    command: sh -c "bun install && bun run dev"
    tty: true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Dev container — must not resurrect itself after `docker stop` or a reboot.
    restart: "no"

volumes:
  bun_node_modules:
  bun_next:
